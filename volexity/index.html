<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>volexity - Austin Hania</title>
    <link rel="stylesheet" href="/transitions.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f5f5f0;
            color: #000;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 960px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #0000EE;
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back:hover {
            color: #EE0000;
            text-decoration: underline;
        }

        h1 {
            font-size: 2rem;
            font-weight: normal;
            font-style: italic;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-align: center;
        }

        .video-wrap {
            width: 100%;
            background: #000;
            border: 1px solid #ddd;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            max-height: calc(100dvh - 160px);
            background: #000;
        }
    </style>
</head>
<body>
    <div class="page">
        <a class="back" href="/">&larr; home</a>
        <h1>volexity</h1>
        <div class="video-wrap">
            <video controls playsinline preload="metadata">
                <source src="volexity.mp4" type="video/mp4">
                Your browser does not support this video.
            </video>
        </div>
    </div>
</body>
</html>
