<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>photos i've taken - Austin Hania</title>
    <link rel="stylesheet" href="/transitions.css">
    <link rel="stylesheet" href="/color-wheel.css">
    <link rel="stylesheet" href="/photos.css">
</head>
<body class="photos-page">
    <header class="photos-header">
        <a class="photos-back" href="/">&larr; home</a>
        <h1>photos i've taken</h1>
    </header>

    <div class="photos-layout">
        <aside class="photos-sidebar" aria-label="Color filter">
            <div id="photos-wheel"></div>
            <div class="photos-swatch" aria-live="polite">
                <dl class="photos-swatch__meta">
                    <dt>HEX</dt>
                    <dd id="swatch-hex">#ffffff</dd>
                    <dt>HSL</dt>
                    <dd id="swatch-hsl">0°, 0%, 100%</dd>
                </dl>
                <p class="photos-swatch__about">
                    <a href="/portfolio/what_is_this.html">What is this?</a>
                </p>
            </div>
        </aside>

        <div class="photos-main">
            <div class="photos-grid" id="photos-grid"></div>
            <p class="photos-status" id="photos-status">loading photos…</p>
        </div>
    </div>

    <div class="photos-detail" id="photos-detail" role="dialog" aria-modal="true" aria-label="Photo detail" hidden>
        <div class="photos-detail__top">
            <button class="photos-detail__close" type="button" id="photos-detail-close">Return</button>
        </div>
        <div class="photos-detail__body">
            <div class="photos-detail__media">
                <img id="photos-detail-img" alt="">
            </div>
            <aside class="photos-detail__story" id="photos-detail-story"></aside>
        </div>
        <p class="photos-detail__caption" id="photos-detail-caption"></p>
    </div>

    <script src="/color-wheel.js"></script>
    <script src="/photos.js"></script>
</body>
</html>
